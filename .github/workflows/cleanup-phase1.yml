name: ORION Cleanup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Audit and Safe Cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Diagnostic
        shell: bash
        run: |
          set -x

          echo "=== PWD ==="
          pwd

          echo "=== ROOT ==="
          ls -la

          echo "=== REPOSITORY FILES ==="
          find . -maxdepth 3 -type f | sort

          echo "=== ANDROID CHECK ==="

          if [ -d android ]; then
            echo "android/: OK"
          else
            echo "android/: MISSING"
          fi

          if [ -d android/app ]; then
            echo "android/app/: OK"
          else
            echo "android/app/: MISSING"
          fi

          if [ -f android/settings.gradle.kts ]; then
            echo "settings.gradle.kts: OK"
          else
            echo "settings.gradle.kts: MISSING"
          fi

          if [ -f android/build.gradle.kts ]; then
            echo "build.gradle.kts: OK"
          else
            echo "build.gradle.kts: MISSING"
          fi

          echo "=== GRADLE WRAPPER ==="

          if [ -f android/gradlew ]; then
            echo "gradlew: OK"
          else
            echo "gradlew: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "wrapper properties: OK"
          else
            echo "wrapper properties: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar: OK"
          else
            echo "wrapper jar: MISSING"
          fi

          echo "=== SUSPICIOUS FILES ==="

          echo "--- ZIP ---"
          find . -type f -name "*.zip" -print | sort || true

          echo "--- BACKUP ---"
          find . -type f \
            \( \
              -iname "*backup*" \
              -o -iname "*snapshot*" \
              -o -iname "*old*" \
            \) \
            -print | sort || true

          echo "--- GENERATED ---"
          find . -type f \
            \( \
              -name "*.log" \
              -o -name "*.tmp" \
              -o -name "*.bak" \
              -o -name "*.before_*" \
            \) \
            -print | sort || true

          echo "=== GIT ==="
          git status --short

          echo "=== DIAGNOSTIC COMPLETE ==="
