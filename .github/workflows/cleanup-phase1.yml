name: ORION Foundation Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Extract Android Foundation and Clean Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspect Android ZIP
        shell: bash
        run: |
          set -e

          ZIP="ORION-Android-Foundation-v0.1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            exit 1
          fi

          echo "=== ZIP FOUND ==="
          ls -lh "$ZIP"

          echo
          echo "=== ZIP CONTENT ==="
          unzip -l "$ZIP"

      - name: Extract Android Foundation
        shell: bash
        run: |
          set -e

          ZIP="ORION-Android-Foundation-v0.1.zip"
          TMP="_android_extract"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$ZIP" -d "$TMP"

          echo "=== EXTRACTED STRUCTURE ==="
          find "$TMP" -maxdepth 5 -print | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          TMP="_android_extract"

          SETTINGS=$(find "$TMP" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          BUILD=$(find "$TMP" \
            -type f \
            -name "build.gradle.kts" \
            -print -quit)

          echo "settings.gradle.kts:"
          echo "${SETTINGS:-NOT FOUND}"

          echo
          echo "build.gradle.kts:"
          echo "${BUILD:-NOT FOUND}"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo
          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          rm -rf android
          mkdir -p android

          cp -a "$PROJECT_DIR"/. android/

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "=== ANDROID ROOT ==="
          find android -maxdepth 4 -print | sort

          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts

          echo
          echo "Android project validation: OK"

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ -f android/gradlew ]; then
            echo "gradlew: OK"
          else
            echo "gradlew: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "wrapper properties: OK"
          else
            echo "wrapper properties: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar: OK"
          else
            echo "wrapper jar: MISSING"
          fi

      - name: Remove generated and temporary files
        shell: bash
        run: |
          set -e

          echo "Removing generated caches..."

          find . -type d \
            \( \
              -name "__pycache__" \
              -o -name ".pytest_cache" \
              -o -name ".mypy_cache" \
              -o -name ".ruff_cache" \
              -o -name ".gradle" \
              -o -name "build" \
            \) \
            -prune \
            -exec rm -rf {} +

          echo "Removing temporary runtime artifacts..."

          rm -rf logs

          rm -f jobs.json
          rm -f orion_state.json

          find . -type f \
            \( \
              -name "*.log" \
              -o -name "*.tmp" \
              -o -name "*.bak" \
            \) \
            -delete

      - name: Remove historical source duplicates
        shell: bash
        run: |
          set -e

          echo "Removing explicitly identified historical copies..."

          find . -type f \
            \( \
              -name "*.before_*" \
              -o -name "*_backup.py" \
              -o -name "*_backup_before_*.py" \
              -o -name "*_old_backup.py" \
              -o -name "*_error_backup.py" \
              -o -name "*.py.backup" \
            \) \
            -delete

          echo "Historical duplicates removed."

      - name: Remove backup directory
        shell: bash
        run: |
          set -e

          if [ -d backups ]; then
            rm -rf backups
            echo "backups/ removed."
          else
            echo "backups/ already absent."
          fi

      - name: Remove obsolete Android ZIP
        shell: bash
        run: |
          set -e

          if [ -d android ] && \
             [ -f android/settings.gradle.kts ] && \
             [ -f android/build.gradle.kts ] && \
             [ -d android/app ]; then

            rm -f ORION-Android-Foundation-v0.1.zip
            echo "Android ZIP removed after successful extraction."

          else
            echo "ERROR: Android validation failed."
            echo "ZIP will NOT be removed."
            exit 1
          fi

      - name: Remove extraction temporary directory
        shell: bash
        run: |
          rm -rf _android_extract

      - name: Final validation
        shell: bash
        run: |
          set -e

          echo "=== FINAL STRUCTURE ==="
          find . -maxdepth 3 -type f | sort

          echo
          echo "=== ANDROID ==="

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts

          echo "Android foundation: VALID"

          echo
          echo "=== GIT STATUS ==="
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: establish Android source of truth and clean legacy artifacts"

          git push
