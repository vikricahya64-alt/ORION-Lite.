name: ORION Cleanup Phase 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Audit and Safe Cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show repository state
        run: |
          set -eux

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo
          echo "=== ROOT ==="
          ls -la

          echo
          echo "=== ANDROID ==="
          if [ -d android ]; then
            find android -maxdepth 3 -type f | sort
          else
            echo "ERROR: android/ does not exist"
            exit 1
          fi

      - name: Validate Android source
        run: |
          set -eux

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts

          echo "Android source validation: OK"

      - name: Inspect Gradle Wrapper
        run: |
          set -eux

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Gradle Wrapper files exist."

      - name: Safe cleanup generated files
        run: |
          set -eux

          echo "Removing generated directories..."

          find . -type d \
            \( \
              -name "__pycache__" \
              -o -name ".pytest_cache" \
              -o -name ".mypy_cache" \
              -o -name ".ruff_cache" \
              -o -name "build" \
              -o -name ".gradle" \
            \) \
            -prune \
            -exec rm -rf {} +

          echo "Removing temporary files..."

          find . -type f \
            \( \
              -name "*.log" \
              -o -name "*.tmp" \
              -o -name "*.bak" \
              -o -name "*.before_*" \
              -o -name "local.properties" \
            \) \
            -delete

          echo "Safe cleanup completed."

      - name: Revalidate Android source
        run: |
          set -eux

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android source remains intact."

      - name: Generate cleanup report
        run: |
          set -eux

          {
            echo "# ORION-Lite Cleanup Phase 1"
            echo
            echo "## Repository"
            git rev-parse --show-toplevel
            echo
            echo "## Git commit"
            git rev-parse HEAD
            echo
            echo "## Remaining ZIP files"
            find . -type f -name "*.zip" -print | sort || true
            echo
            echo "## Remaining backup-like files"
            find . -type f \
              \( \
                -iname "*backup*" \
                -o -iname "*snapshot*" \
                -o -iname "*old*" \
              \) \
              -print | sort || true
            echo
            echo "## Android files"
            find android -maxdepth 3 -type f | sort
          } > cleanup-phase1-report.md

      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: ORION-cleanup-phase1-report
          path: cleanup-phase1-report.md
          if-no-files-found: error

      - name: Final status
        run: |
          echo "ORION Cleanup Phase 1 completed successfully."
