name: Bootstrap Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Generate Wrapper
        run: |
          set -eux

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

          chmod +x gradlew

      - name: Verify Wrapper
        run: |
          set -eux

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Commit Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/gradlew
          git add android/gradlew.bat
          git add android/gradle/wrapper/

          if git diff --cached --quiet; then
            echo "No wrapper changes."
            exit 0
          fi

          git commit -m "build: add Gradle wrapper"
          git push
