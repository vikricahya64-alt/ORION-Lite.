name: ORION Android CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/orion-build.yml"

  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/orion-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle Wrapper
        run: |
          set -eux

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle Wrapper: OK"

      - name: Show environment
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        run: |
          set -eux

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "APK verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
