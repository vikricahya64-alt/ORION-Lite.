name: ORION Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Test and Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Environment
        run: |
          set -eux
          java -version
          ./gradlew --version || true

      - name: Validate Android project
        run: |
          set -eux

          test -d app
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Android project structure: OK"

      - name: Prepare Gradle
        run: |
          set -eux
          chmod +x gradlew

      - name: Run unit tests
        run: |
          set -eux
          ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          set -eux
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
