name: ORION Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ORION-Android-Foundation-v0.1.zip"
      - ".github/workflows/orion-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ORION Android
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Ambil repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Ekstrak Android Foundation
      # --------------------------------------------------
      - name: Extract ORION Foundation
        run: |
          rm -rf workspace
          mkdir -p workspace
          unzip -o ORION-Android-Foundation-v0.1.zip -d workspace

          echo "=== Repository ==="
          ls -la

          echo "=== Workspace ==="
          find workspace -maxdepth 4 -type f | sort

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # --------------------------------------------------
      # 6. Perbaiki JVM target
      # --------------------------------------------------
      - name: Configure JVM target
        working-directory: workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          compile_marker = "    compileSdk = 35\n"

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              addition = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

              text = text.replace(
                  compile_marker,
                  addition,
                  1
              )

          path.write_text(text)

          print("=== app/build.gradle.kts ===")
          print(text)
          PY

      # --------------------------------------------------
      # 7. Tambahkan Agent Core
      # --------------------------------------------------
      - name: Add ORION Agent Core
        working-directory: workspace
        run: |
          mkdir -p app/src/main/java/com/orion/lite/agent
          mkdir -p app/src/test/java/com/orion/lite/agent

          cat > app/src/main/java/com/orion/lite/agent/AgentResult.kt <<'EOF'
          package com.orion.lite.agent

          data class AgentResult(
              val text: String,
              val handled: Boolean = false
          )
          EOF

          cat > app/src/main/java/com/orion/lite/agent/AgentEngine.kt <<'EOF'
          package com.orion.lite.agent

          class AgentEngine {

              fun execute(input: String): AgentResult {
                  val command = input.trim()

                  if (command.isEmpty()) {
                      return AgentResult(
                          text = "Perintah kosong.",
                          handled = false
                      )
                  }

                  return when {
                      command.equals("ping", ignoreCase = true) -> {
                          AgentResult(
                              text = "ORION online.",
                              handled = true
                          )
                      }

                      command.equals("status", ignoreCase = true) -> {
                          AgentResult(
                              text = "Agent Core v0.1 aktif.",
                              handled = true
                          )
                      }

                      command.equals("hello", ignoreCase = true) -> {
                          AgentResult(
                              text = "Halo. Saya ORION.",
                              handled = true
                          )
                      }

                      else -> {
                          AgentResult(
                              text = "Perintah diterima: $command",
                              handled = false
                          )
                      }
                  }
              }
          }
          EOF

          cat > app/src/test/java/com/orion/lite/agent/AgentEngineTest.kt <<'EOF'
          package com.orion.lite.agent

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class AgentEngineTest {

              private val agent = AgentEngine()

              @Test
              fun pingWorks() {
                  val result = agent.execute("ping")

                  assertTrue(result.handled)
                  assertEquals("ORION online.", result.text)
              }

              @Test
              fun statusWorks() {
                  val result = agent.execute("status")

                  assertTrue(result.handled)
                  assertEquals(
                      "Agent Core v0.1 aktif.",
                      result.text
                  )
              }

              @Test
              fun helloWorks() {
                  val result = agent.execute("hello")

                  assertTrue(result.handled)
                  assertEquals(
                      "Halo. Saya ORION.",
                      result.text
                  )
              }

              @Test
              fun unknownCommandIsNotHandled() {
                  val result = agent.execute("test")

                  assertFalse(result.handled)
                  assertEquals(
                      "Perintah diterima: test",
                      result.text
                  )
              }

              @Test
              fun emptyCommandIsRejected() {
                  val result = agent.execute("")

                  assertFalse(result.handled)
                  assertEquals(
                      "Perintah kosong.",
                      result.text
                  )
              }
          }
          EOF

      # --------------------------------------------------
      # 8. Test Agent
      # --------------------------------------------------
      - name: Run tests
        working-directory: workspace
        run: |
          gradle test

      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------
      - name: Build debug APK
        working-directory: workspace
        run: |
          gradle assembleDebug

      # --------------------------------------------------
      # 10. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug-apk
          path: workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
