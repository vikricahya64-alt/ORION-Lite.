name: ORION Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ORION-Android-Foundation-v0.1.zip"
      - ".github/workflows/orion-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ORION Foundation
        run: |
          rm -rf workspace
          mkdir workspace
          unzip -o ORION-Android-Foundation-v0.1.zip -d workspace

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fix JVM target
        working-directory: workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "    compileSdk = 35\n"

          fix = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, fix, 1)

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Test
        working-directory: workspace
        run: gradle test

      - name: Build APK
        working-directory: workspace
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug-apk
          path: workspace/app/build/outputs/apk/debug/app-debug.apk
