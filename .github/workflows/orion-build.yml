name: ORION Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ORION-Android-Foundation-v0.1.zip"
      - ".github/workflows/orion-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ORION Android
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ORION Foundation
        run: |
          rm -rf workspace
          mkdir -p workspace
          unzip -o ORION-Android-Foundation-v0.1.zip -d workspace

          echo "=== WORKSPACE ==="
          find workspace -maxdepth 5 -type f | sort

      - name: Diagnose UI
        working-directory: workspace
        run: |
          echo "=== PLACEHOLDER SEARCH ==="
          grep -RniF "orion lite android foundation v0.1" app || true

          echo "=== ACTIVITIES ==="
          grep -RniE "class .*Activity|setContentView|setContent[[:space:]]*\{|@Composable|onCreate" app/src/main \
            --include='*.kt' \
            --include='*.java' \
            || true

          echo "=== MANIFEST ==="
          find app/src/main -name "AndroidManifest.xml" \
            -exec sed -n '1,240p' {} \;

          echo "=== LAYOUTS ==="
          find app/src/main/res -type f -name "*.xml" -print

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure JVM target
        working-directory: workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "    compileSdk = 35\n"

              addition = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

              text = text.replace(marker, addition, 1)
              path.write_text(text)

          print(path.read_text())
          PY

      - name: Add ORION Agent Core
        working-directory: workspace
        run: |
          mkdir -p app/src/main/java/com/orion/lite/agent
          mkdir -p app/src/test/java/com/orion/lite/agent

          cat > app/src/main/java/com/orion/lite/agent/AgentResult.kt <<'EOF'
          package com.orion.lite.agent

          data class AgentResult(
              val text: String,
              val handled: Boolean = false
          )
          EOF

          cat > app/src/main/java/com/orion/lite/agent/AgentEngine.kt <<'EOF'
          package com.orion.lite.agent

          class AgentEngine {

              fun execute(input: String): AgentResult {
                  val command = input.trim()

                  if (command.isEmpty()) {
                      return AgentResult(
                          "Perintah kosong.",
                          false
                      )
                  }

                  return when {
                      command.equals("ping", true) ->
                          AgentResult("ORION online.", true)

                      command.equals("status", true) ->
                          AgentResult(
                              "Agent Core v0.1 aktif.",
                              true
                          )

                      command.equals("hello", true) ->
                          AgentResult(
                              "Halo. Saya ORION.",
                              true
                          )

                      else ->
                          AgentResult(
                              "Perintah diterima: $command",
                              false
                          )
                  }
              }
          }
          EOF

          cat > app/src/test/java/com/orion/lite/agent/AgentEngineTest.kt <<'EOF'
          package com.orion.lite.agent

          import org.junit.Assert.*
          import org.junit.Test

          class AgentEngineTest {

              private val agent = AgentEngine()

              @Test
              fun pingWorks() {
                  val result = agent.execute("ping")
                  assertTrue(result.handled)
                  assertEquals("ORION online.", result.text)
              }

              @Test
              fun statusWorks() {
                  val result = agent.execute("status")
                  assertTrue(result.handled)
                  assertEquals(
                      "Agent Core v0.1 aktif.",
                      result.text
                  )
              }

              @Test
              fun helloWorks() {
                  val result = agent.execute("hello")
                  assertTrue(result.handled)
                  assertEquals(
                      "Halo. Saya ORION.",
                      result.text
                  )
              }
          }
          EOF

      - name: Run tests
        working-directory: workspace
        run: |
          gradle test

      - name: Build debug APK
        working-directory: workspace
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug-apk
          path: workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
