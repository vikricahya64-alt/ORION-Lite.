name: ORION Android CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/orion-build.yml"

  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/orion-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orion-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Android foundation
        run: |
          set -eux

          test -d app
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project: OK"

      - name: Validate Gradle Wrapper
        run: |
          set -eux

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle Wrapper: OK"

      - name: Verify Gradle
        run: |
          set -eux

          ./gradlew --version

      - name: Run unit tests
        run: |
          set -eux

          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build debug APK
        run: |
          set -eux

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        run: |
          set -eux

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
