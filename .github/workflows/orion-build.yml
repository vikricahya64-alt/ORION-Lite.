name: ORION Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  android:
    name: Test and Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle Wrapper
        run: |
          set -eux

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

          chmod +x gradlew

      - name: Validate Android project
        run: |
          set -eux

          test -d app
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Android project structure: OK"

      - name: Show Gradle version
        run: |
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew test \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
