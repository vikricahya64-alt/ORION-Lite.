name: ORION Memory Guard Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-guard:
    name: Build ORION Memory Guard Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail

          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"
          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"
          ROUTER="android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt"
          SAFETY="android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt"
          EXECUTOR="android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt"

          test -f "$CORE"
          test -f "$MEMORY"
          test -f "$ROUTER"
          test -f "$SAFETY"
          test -f "$EXECUTOR"

          grep -Fq 'previous: MemoryRecord?' "$CORE"
          grep -Fq 'data class MemoryRecord' "$MEMORY"
          grep -Fq 'BATTERY_ATTENTION' "$ROUTER"

          echo "Repository verification passed."

      - name: Backup OrionCore
        shell: bash
        run: |
          set -euo pipefail

          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          cp "$CORE" "$CORE.backup"

          echo "OrionCore backup created."

      - name: Apply Memory Decision Guard
        shell: bash
        run: |
          set -euo pipefail

          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          if grep -Fq 'val repeatBatteryAttention =' "$CORE"; then
            echo "Memory Decision Guard already exists."
            exit 0
          fi

          grep -Fq '        return when {' "$CORE"

          python3 -c '
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "        return when {"

          if marker not in text:
              raise SystemExit("ERROR: return when marker not found")

          guard = """        val repeatBatteryAttention =
              previous != null &&
              previous.state == "ATTENTION" &&
              previous.actionId == "BATTERY_ATTENTION" &&
              previous.result.contains(
                  "Battery Settings",
                  ignoreCase = true
              ) &&
              device.batteryPercent <= 50

          if (repeatBatteryAttention) {
              return OrionDecision(
                  "NORMAL",
                  "Previous battery attention already handled"
              )
          }

"""

          text = text.replace(marker, guard + marker, 1)

          path.write_text(text)
          print("Memory Decision Guard applied successfully.")
          ' "$CORE"

      - name: Verify Memory Decision Guard
        shell: bash
        run: |
          set -euo pipefail

          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          grep -Fq 'val repeatBatteryAttention =' "$CORE"
          grep -Fq 'previous.state == "ATTENTION"' "$CORE"
          grep -Fq 'previous.actionId == "BATTERY_ATTENTION"' "$CORE"
          grep -Fq 'previous.result.contains(' "$CORE"
          grep -Fq '"Battery Settings"' "$CORE"
          grep -Fq 'device.batteryPercent <= 50' "$CORE"
          grep -Fq 'Previous battery attention already handled' "$CORE"

          test "$(grep -Fc 'val repeatBatteryAttention =' "$CORE")" -eq 1

          echo "Memory Decision Guard verification passed."

      - name: Verify protected layers unchanged
        shell: bash
        run: |
          set -euo pipefail

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"
          ROUTER="android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt"
          SAFETY="android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt"
          EXECUTOR="android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt"

          git diff --exit-code -- "$MEMORY"
          git diff --exit-code -- "$ROUTER"
          git diff --exit-code -- "$SAFETY"
          git diff --exit-code -- "$EXECUTOR"

          echo "Protected layers unchanged."

      - name: Verify no test directories
        shell: bash
        run: |
          set -euo pipefail

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK verified:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-memory-guard
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Memory Guard Layer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/orion/OrionCore.kt

          if git diff --cached --quiet; then
            echo "No Memory Guard changes to commit."
          else
            git commit -m "fix: add memory decision guard"
            git push
          fi
