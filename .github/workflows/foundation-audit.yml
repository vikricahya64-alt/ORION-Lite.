name: ORION Foundation Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify Clean Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit repository
        shell: bash
        run: |
          set -eux

          echo "=== ROOT ==="
          pwd

          echo
          echo "=== TOP LEVEL ==="
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

          echo
          echo "=== ANDROID ==="
          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          echo "Android foundation: OK"

          echo
          echo "=== FORBIDDEN ARTIFACTS ==="

          if find . -type f \
            \( \
              -name "*.zip" \
              -o -name "*.before_*" \
              -o -name "*_backup*" \
              -o -name "*.py.backup" \
              -o -name "*.p" \
              -o -name "*.log" \
              -o -name "*.pyc" \
            \) \
            -print -quit | grep -q .; then

            echo "ERROR: obsolete artifacts detected:"
            find . -type f \
              \( \
                -name "*.zip" \
                -o -name "*.before_*" \
                -o -name "*_backup*" \
                -o -name "*.py.backup" \
                -o -name "*.p" \
                -o -name "*.log" \
                -o -name "*.pyc" \
              \) \
              -print

            exit 1
          fi

          echo "No obsolete artifacts."

          echo
          echo "=== FORBIDDEN DIRECTORIES ==="

          for dir in \
            backups \
            logs \
            android/.github
          do
            if test -e "$dir"; then
              echo "ERROR: $dir still exists"
              exit 1
            fi
          done

          echo "No forbidden directories."

          echo
          echo "=== WORKFLOWS ==="
          find .github/workflows -maxdepth 1 -type f -print | sort

          echo
          echo "=== GIT STATUS ==="
          git status --short

          echo
          echo "FOUNDATION AUDIT: PASSED"
