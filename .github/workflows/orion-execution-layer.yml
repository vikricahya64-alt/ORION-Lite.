name: ORION Execution Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ORION Execution Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Create ActionRouter
        run: |
          cat > android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt <<'EOF'
          package com.orion.lite.orion

          data class OrionAction(
              val id: String,
              val description: String
          )

          class ActionRouter {

              fun route(decision: OrionDecision): OrionAction {

                  return when (decision.state) {

                      "LOW_POWER" -> OrionAction(
                          id = "LOW_POWER_NOTICE",
                          description = "Battery is low. Reduce unnecessary activity."
                      )

                      "ATTENTION" -> OrionAction(
                          id = "BATTERY_ATTENTION",
                          description = "Battery level requires attention."
                      )

                      "NORMAL" -> OrionAction(
                          id = "MONITOR",
                          description = "Continue normal monitoring."
                      )

                      else -> OrionAction(
                          id = "UNKNOWN",
                          description = "Unable to determine required action."
                      )
                  }
              }
          }
          EOF

      - name: Create ActionExecutor
        run: |
          cat > android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt <<'EOF'
          package com.orion.lite.orion

          data class ExecutionResult(
              val actionId: String,
              val executed: Boolean,
              val message: String
          )

          class ActionExecutor {

              fun execute(action: OrionAction): ExecutionResult {

                  return when (action.id) {

                      "LOW_POWER_NOTICE" ->
                          ExecutionResult(
                              action.id,
                              true,
                              action.description
                          )

                      "BATTERY_ATTENTION" ->
                          ExecutionResult(
                              action.id,
                              true,
                              action.description
                          )

                      "MONITOR" ->
                          ExecutionResult(
                              action.id,
                              true,
                              action.description
                          )

                      else ->
                          ExecutionResult(
                              action.id,
                              false,
                              "Action not available."
                          )
                  }
              }
          }
          EOF

      - name: Update MainActivity
        run: |
          cat > android/app/src/main/java/com/orion/lite/MainActivity.kt <<'EOF'
          package com.orion.lite

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.orion.lite.orion.ActionExecutor
          import com.orion.lite.orion.ActionRouter
          import com.orion.lite.orion.DeviceMonitor
          import com.orion.lite.orion.OrionCore
          import com.orion.lite.orion.OrionKernel

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val kernel = OrionKernel()
                  val monitor = DeviceMonitor(this)
                  val core = OrionCore()
                  val router = ActionRouter()
                  val executor = ActionExecutor()

                  kernel.register("device_monitor", monitor)
                  kernel.register("core", core)
                  kernel.register("action_router", router)
                  kernel.register("action_executor", executor)

                  kernel.boot()

                  setContent {

                      var state = remember {
                          mutableStateOf("BOOTING")
                      }

                      var battery = remember {
                          mutableStateOf(-1)
                      }

                      var action = remember {
                          mutableStateOf("Starting...")
                      }

                      LaunchedEffect(Unit) {

                          kernel.heartbeat()

                          val device = monitor.read()
                          val decision = core.analyze(device)
                          val routedAction = router.route(decision)
                          val result = executor.execute(routedAction)

                          battery.value = device.batteryPercent
                          state.value = decision.state
                          action.value = result.message
                      }

                      MaterialTheme {

                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(24.dp),
                              verticalArrangement =
                                  Arrangement.Center
                          ) {

                              Text(
                                  text = "ORION Lite",
                                  style =
                                      MaterialTheme.typography.headlineMedium
                              )

                              Text(
                                  text = "Kernel: ${
                                      if (kernel.running)
                                          "ONLINE"
                                      else
                                          "OFFLINE"
                                  }",
                                  modifier =
                                      Modifier.padding(top = 16.dp)
                              )

                              Text(
                                  text = "State: ${state.value}",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )

                              Text(
                                  text = "Battery: ${battery.value}%",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )

                              Text(
                                  text = "Action: ${action.value}",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify runtime source
        run: |
          test -f android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt
          test -f android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feat: add ORION action execution layer"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Lite-execution
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
