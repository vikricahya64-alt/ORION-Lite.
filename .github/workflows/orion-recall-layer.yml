name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recall:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify OrionMemory
        shell: bash
        run: |
          set -euo pipefail

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY"
          grep -Fq 'fun recall()' "$MEMORY"

          echo "OrionMemory.recall() verified."

      - name: Apply Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          echo "MainActivity backup created."

          grep -Fq 'var action = remember {' "$MAIN"
          grep -Fq 'LaunchedEffect(Unit)' "$MAIN"
          grep -Fq 'val device = monitor.read()' "$MAIN"
          grep -Fq '"Action: ${action.value}"' "$MAIN"

          if grep -Fq 'val previous = memory.recall()' "$MAIN"; then
            echo "Recall Layer already exists."
            exit 0
          fi

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # ============================================================
          # 1. Find complete Action state block
          # ============================================================

          marker = "var action = remember {"
          start = text.find(marker)

          if start < 0:
              raise SystemExit("ERROR: action state not found")

          open_brace = text.find("{", start)

          if open_brace < 0:
              raise SystemExit("ERROR: action opening brace not found")

          depth = 0
          end = None

          for i in range(open_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("ERROR: action block is not balanced")

          # ============================================================
          # 2. Add Recall state after Action state
          # ============================================================

          recall_state = '''
          
              var recall = remember {
                  mutableStateOf("No previous event.")
              }'''

          text = text[:end] + recall_state + text[end:]

          # ============================================================
          # 3. Add recall() before Observe
          # ============================================================

          effect = text.find("LaunchedEffect(Unit) {")

          if effect < 0:
              raise SystemExit("ERROR: LaunchedEffect(Unit) not found")

          observe = text.find("val device = monitor.read()", effect)

          if observe < 0:
              raise SystemExit("ERROR: monitor.read() not found")

          recall_logic = '''
          
                  val previous = memory.recall()

                  recall.value = if (previous != null) {
                      "Previous: ${previous.state} | Battery: ${previous.battery}% | Action: ${previous.actionId} | Result: ${previous.result}"
                  } else {
                      "No previous event."
                  }

          '''

          text = text[:observe] + recall_logic + text[observe:]

          # ============================================================
          # 4. Find Action UI using the Action string only
          # ============================================================

          action_string = '"Action: ${action.value}"'
          string_pos = text.find(action_string)

          if string_pos < 0:
              raise SystemExit("ERROR: Action UI string not found")

          text_call = text.rfind("Text(", 0, string_pos)

          if text_call < 0:
              raise SystemExit("ERROR: Action Text call not found")

          # ============================================================
          # 5. Find closing parenthesis of Text(...)
          # ============================================================

          depth = 0
          text_end = None

          for i in range(text_call, len(text)):
              char = text[i]

              if char == "(":
                  depth += 1

              elif char == ")":
                  depth -= 1

                  if depth == 0:
                      text_end = i + 1
                      break

          if text_end is None:
              raise SystemExit(
                  "ERROR: Action Text parenthesis is not balanced"
              )

          if action_string not in text[text_call:text_end]:
              raise SystemExit(
                  "ERROR: Located Text call does not contain Action string"
              )

          # ============================================================
          # 6. Insert Recall UI after Action Text
          # ============================================================

          recall_ui = '''
          
                    Text(
                        text =
                            "Recall: ${recall.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )'''

          text = text[:text_end] + recall_ui + text[text_end:]

          # ============================================================
          # 7. Write
          # ============================================================

          path.write_text(text)

          print("Recall Layer source transformation completed.")
          PY

          echo "Checking generated Kotlin structure..."

          grep -Fq 'var recall = remember {' "$MAIN"
          grep -Fq 'val previous = memory.recall()' "$MAIN"
          grep -Fq '"Recall: ${recall.value}"' "$MAIN"

          test "$(grep -Fc 'var recall = remember {' "$MAIN")" -eq 1
          test "$(grep -Fc 'val previous = memory.recall()' "$MAIN")" -eq 1
          test "$(grep -Fc '"Recall: ${recall.value}"' "$MAIN")" -eq 1

          echo "Recall Layer source verification passed."

      - name: Verify Recall placement
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()

          action = text.find("var action = remember {")
          recall_state = text.find("var recall = remember {")
          effect = text.find("LaunchedEffect(Unit) {")
          recall_logic = text.find("val previous = memory.recall()")
          observe = text.find("val device = monitor.read()")
          recall_ui = text.find('"Recall: ${recall.value}"')

          checks = {
              "Action exists": action >= 0,
              "Recall state exists": recall_state >= 0,
              "Recall after Action": recall_state > action,
              "LaunchedEffect exists": effect >= 0,
              "Recall logic exists": recall_logic >= 0,
              "Recall before Observe": (
                  recall_logic >= 0
                  and observe >= 0
                  and recall_logic < observe
              ),
              "Recall UI exists": recall_ui >= 0,
          }

          for name, result in checks.items():
              print(
                  f"{name}: "
                  f"{'OK' if result else 'FAIL'}"
              )

          if not all(checks.values()):
              raise SystemExit(
                  "ERROR: Recall placement verification failed"
              )

          print("Recall placement verification passed.")
          PY

      - name: Verify no test directories
        shell: bash
        run: |
          set -euo pipefail

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No Recall changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
          fi
