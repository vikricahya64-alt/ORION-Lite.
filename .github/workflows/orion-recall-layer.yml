name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recall:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify OrionMemory
        shell: bash
        run: |
          set -e

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY"
          grep -q "fun recall()" "$MEMORY"

          echo "OrionMemory recall() OK"

      - name: Apply Recall Layer
        shell: bash
        run: |
          set -e

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN"

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # ---------------------------------------------------------
          # 1. Add recall state
          # ---------------------------------------------------------

          if "var recall = remember" not in text:

              marker = 'var action = remember {'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: action state marker not found"
                  )

              start = text.index(marker)

              # Find the end of the action remember block.
              end = text.find("}", start)

              if end == -1:
                  raise SystemExit(
                      "ERROR: action state block not found"
                  )

              end += 1

              insertion = """

              var recall = remember {
                  mutableStateOf("No previous event.")
              }"""

              text = text[:end] + insertion + text[end:]

          # ---------------------------------------------------------
          # 2. Add recall at runtime start
          # ---------------------------------------------------------

          if "val previous = memory.recall()" not in text:

              marker = "LaunchedEffect(Unit) {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: LaunchedEffect(Unit) not found"
                  )

              insertion = """LaunchedEffect(Unit) {

                  val previous = memory.recall()

                  recall.value =
                      if (previous != null) {
                          "Previous: ${previous.state} | " +
                              "Battery: ${previous.battery}% | " +
                              "Action: ${previous.actionId} | " +
                              "Result: ${previous.result}"
                      } else {
                          "No previous event."
                      }
          """

              text = text.replace(
                  marker,
                  insertion,
                  1
              )

          # ---------------------------------------------------------
          # 3. Add Recall display
          # ---------------------------------------------------------

          if '"Recall: ${recall.value}"' not in text:

              marker = '"Action: ${action.value}"'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Action display marker not found"
                  )

              target = """                    Text(
                        text =
                            "Action: ${action.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )"""

              if target not in text:
                  raise SystemExit(
                      "ERROR: Action Text block not found"
                  )

              replacement = target + """

                    Text(
                        text =
                            "Recall: ${recall.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )"""

              text = text.replace(
                  target,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Recall Layer applied successfully.")
          PY

      - name: Verify Recall Layer
        shell: bash
        run: |
          set -e

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          grep -q "val previous = memory.recall()" "$MAIN"
          grep -q "var recall = remember" "$MAIN"
          grep -q '"Recall: ${recall.value}"' "$MAIN"

          echo "Recall Layer verification OK"

      - name: Verify no test directories
        shell: bash
        run: |
          set -e

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No Recall changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
          fi
