name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recall:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify OrionMemory
        shell: bash
        run: |
          set -e

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY"
          grep -Fq "fun recall()" "$MEMORY"

          echo "OrionMemory.recall() verified."

      - name: Apply Recall Layer
        shell: bash
        run: |
          set -e

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          echo "MainActivity backup created."

          grep -Fq "val memory = OrionMemory(this)" "$MAIN"
          grep -Fq 'Text(' "$MAIN"
          grep -Fq '"Action: ${action.value}"' "$MAIN"

          if grep -Fq "memory.recall()" "$MAIN"; then
            echo "Recall already exists."
            exit 0
          fi

          sed -i '/LaunchedEffect(Unit) {/a\
\
                val previous = memory.recall()\
\
                recall.value = if (previous != null) {\
                    "Previous: ${previous.state} | Battery: ${previous.battery}% | Action: ${previous.actionId} | Result: ${previous.result}"\
                } else {\
                    "No previous event."\
                }\
' "$MAIN"

          sed -i '/var action = remember {/a\
\
              var recall = remember {\
                  mutableStateOf("No previous event.")\
              }\
' "$MAIN"

          sed -i '/"Action: ${action.value}"/a\
                        Text(\
                            text = "Recall: ${recall.value}",\
                            modifier = Modifier.padding(top = 8.dp)\
                        )\
' "$MAIN"

          echo "Recall Layer patch applied."

      - name: Verify Recall Layer
        shell: bash
        run: |
          set -e

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          grep -Fq "memory.recall()" "$MAIN"
          grep -Fq "var recall = remember" "$MAIN"
          grep -Fq '"Recall: ${recall.value}"' "$MAIN"

          echo "Recall Layer verified."

      - name: Verify no test directories
        shell: bash
        run: |
          set -e

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
          fi
