name: ORION Memory Context Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-context:
    name: Build ORION Memory Context Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"
          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"
          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"
          ROUTER="android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt"
          SAFETY="android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt"
          EXECUTOR="android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt"

          test -f "$MAIN"
          test -f "$CORE"
          test -f "$MEMORY"
          test -f "$ROUTER"
          test -f "$SAFETY"
          test -f "$EXECUTOR"

          grep -Fq 'fun recall()' "$MEMORY"
          grep -Fq 'data class MemoryRecord' "$MEMORY"
          grep -Fq 'fun analyze(' "$CORE"
          grep -Fq 'core.analyze(device)' "$MAIN"

          echo "Repository structure verified."

      - name: Backup source files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"
          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          cp "$MAIN" "$MAIN.backup"
          cp "$CORE" "$CORE.backup"

          echo "Source backups created."

      - name: Apply Memory Context Layer
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"
          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          python3 - "$MAIN" "$CORE" <<'PY'
          import sys
          from pathlib import Path

          main_path = Path(sys.argv[1])
          core_path = Path(sys.argv[2])

          main = main_path.read_text()
          core = core_path.read_text()

          # ============================================================
          # MAINACTIVITY
          # ============================================================

          old_call = "core.analyze(device)"

          if old_call not in main:
              raise SystemExit(
                  "ERROR: expected core.analyze(device) call not found"
              )

          new_call = """core.analyze(
                      device,
                      previous
                  )"""

          main = main.replace(old_call, new_call, 1)

          # ============================================================
          # ORIONCORE
          # ============================================================

          old_signature = """fun analyze(device: DeviceState): OrionDecision {"""

          if old_signature not in core:
              raise SystemExit(
                  "ERROR: expected OrionCore analyze signature not found"
              )

          new_signature = """fun analyze(
              device: DeviceState,
              previous: MemoryRecord?
          ): OrionDecision {"""

          core = core.replace(old_signature, new_signature, 1)

          # ============================================================
          # Add MemoryRecord import if necessary
          # ============================================================

          if "MemoryRecord" not in core:
              raise SystemExit(
                  "ERROR: MemoryRecord reference could not be established"
              )

          if (
              "import com.orion.lite.orion.MemoryRecord" not in core
              and "MemoryRecord" in core
          ):
              package_end = core.find("\n", core.find("package "))

              if package_end == -1:
                  raise SystemExit(
                      "ERROR: package declaration not found"
                  )

              core = (
                  core[:package_end + 1]
                  + "\nimport com.orion.lite.orion.MemoryRecord"
                  + core[package_end + 1:]
              )

          main_path.write_text(main)
          core_path.write_text(core)

          print("Memory Context Layer transformation completed.")
          PY

      - name: Verify Memory Context source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"
          CORE="android/app/src/main/java/com/orion/lite/orion/OrionCore.kt"

          grep -Fq 'val previous = memory.recall()' "$MAIN"
          grep -Fq 'core.analyze(' "$MAIN"
          grep -Fq 'device,' "$MAIN"
          grep -Fq 'previous' "$MAIN"

          grep -Fq 'previous: MemoryRecord?' "$CORE"

          echo "Memory Context source verification passed."

      - name: Verify protected layers unchanged
        shell: bash
        run: |
          set -euo pipefail

          ROUTER="android/app/src/main/java/com/orion/lite/orion/ActionRouter.kt"
          SAFETY="android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt"
          EXECUTOR="android/app/src/main/java/com/orion/lite/orion/ActionExecutor.kt"

          git diff --exit-code -- "$ROUTER"
          git diff --exit-code -- "$SAFETY"
          git diff --exit-code -- "$EXECUTOR"

          echo "ActionRouter unchanged."
          echo "SafetyPolicy unchanged."
          echo "ActionExecutor unchanged."

      - name: Verify Memory implementation unchanged
        shell: bash
        run: |
          set -euo pipefail

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          git diff --exit-code -- "$MEMORY"

          echo "OrionMemory storage implementation unchanged."

      - name: Verify no test directories
        shell: bash
        run: |
          set -euo pipefail

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-memory-context
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Memory Context Layer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            android/app/src/main/java/com/orion/lite/MainActivity.kt \
            android/app/src/main/java/com/orion/lite/orion/OrionCore.kt

          if git diff --cached --quiet; then
            echo "No Memory Context changes to commit."
          else
            git commit -m "feat: add memory context to ORION decision"
            git push
          fi
