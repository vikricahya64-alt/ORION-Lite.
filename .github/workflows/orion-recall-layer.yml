name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify Memory Layer
        shell: bash
        run: |
          set -eux

          MEMORY_FILE="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY_FILE"

          grep -q "fun recall()" "$MEMORY_FILE"

          echo "OrionMemory recall() verified."

      - name: Update MainActivity with Recall Layer
        shell: bash
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/java/com/orion/lite/MainActivity.kt"
          )

          text = path.read_text()

          # ------------------------------------------------------------
          # 1. Add recall state
          # ------------------------------------------------------------

          old = '''            var action = remember {
                  mutableStateOf("Starting...")
              }
          '''

          new = '''            var action = remember {
                  mutableStateOf("Starting...")
              }

              var recall = remember {
                  mutableStateOf("No previous event.")
              }
          '''

          if "var recall = remember" not in text:
              if old not in text:
                  raise SystemExit(
                      "ERROR: Could not find action state block."
                  )

              text = text.replace(old, new, 1)

          # ------------------------------------------------------------
          # 2. Recall previous memory at START
          # ------------------------------------------------------------

          old = '''            LaunchedEffect(Unit) {

                kernel.heartbeat()

                val device = monitor.read()
          '''

          new = '''            LaunchedEffect(Unit) {

                val previous = memory.recall()

                recall.value =
                    if (previous != null) {
                        "Previous: ${previous.state} | " +
                            "Battery: ${previous.battery}% | " +
                            "Action: ${previous.actionId} | " +
                            "Result: ${previous.result}"
                    } else {
                        "No previous event."
                    }

                kernel.heartbeat()

                val device = monitor.read()
          '''

          if "val previous = memory.recall()" not in text:
              if old not in text:
                  raise SystemExit(
                      "ERROR: Could not find runtime start block."
                  )

              text = text.replace(old, new, 1)

          # ------------------------------------------------------------
          # 3. Display recalled event
          # ------------------------------------------------------------

          old = '''                    Text(
                        text =
                            "Action: ${action.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )
'''

          new = '''                    Text(
                        text =
                            "Action: ${action.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )

                    Text(
                        text =
                            "Recall: ${recall.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )
'''

          if 'text =\n                            "Recall: ${recall.value}"' not in text:
              if old not in text:
                  raise SystemExit(
                      "ERROR: Could not find Action UI block."
                  )

              text = text.replace(old, new, 1)

          path.write_text(text)

          print("MainActivity Recall Layer update completed.")
          PY

      - name: Verify Recall Integration
        shell: bash
        run: |
          set -eux

          MAIN_FILE="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN_FILE"

          grep -q "val previous = memory.recall()" "$MAIN_FILE"
          grep -q 'mutableStateOf("No previous event.")' "$MAIN_FILE"
          grep -q '"Recall: ${recall.value}"' "$MAIN_FILE"

          echo "Recall integration verified."

      - name: Verify No Test Foundation
        shell: bash
        run: |
          set -eux

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test/ or androidTest/ directory found."

      - name: Build APK
        working-directory: android
        run: |
          set -eux

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK verified:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
