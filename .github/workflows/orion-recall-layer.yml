name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recall:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify OrionMemory
        shell: bash
        run: |
          set -euo pipefail

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY"
          grep -Fq "fun recall()" "$MEMORY"

          echo "OrionMemory.recall() verified."

      - name: Apply Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          echo "MainActivity backup created."

          grep -Fq 'val memory = OrionMemory(this)' "$MAIN"
          grep -Fq 'LaunchedEffect(Unit)' "$MAIN"
          grep -Fq '"Action: ${action.value}"' "$MAIN"

          if grep -Fq 'memory.recall()' "$MAIN"; then
            echo "Recall Layer already exists."
            exit 0
          fi

          TMP="$(mktemp)"

          awk '
          /var action = remember \{/ {
              print
              print ""
              print "              var recall = remember {"
              print "                  mutableStateOf(\"No previous event.\")"
              print "              }"
              next
          }
          {
              print
          }
          ' "$MAIN" > "$TMP"

          mv "$TMP" "$MAIN"

          TMP="$(mktemp)"

          awk '
          /LaunchedEffect\(Unit\) \{/ {
              print
              print ""
              print "                val previous = memory.recall()"
              print ""
              print "                recall.value = if (previous != null) {"
              print "                    \"Previous: \${previous.state} | Battery: \${previous.battery}% | Action: \${previous.actionId} | Result: \${previous.result}\""
              print "                } else {"
              print "                    \"No previous event.\""
              print "                }"
              next
          }
          {
              print
          }
          ' "$MAIN" > "$TMP"

          mv "$TMP" "$MAIN"

          TMP="$(mktemp)"

          awk '
          /"Action: \$\{action\.value\}"/ {
              print
              print ""
              print "                    Text("
              print "                        text = \"Recall: \${recall.value}\","
              print "                        modifier = Modifier.padding(top = 8.dp)"
              print "                    )"
              next
          }
          {
              print
          }
          ' "$MAIN" > "$TMP"

          mv "$TMP" "$MAIN"

          echo "Recall Layer patch applied."

      - name: Verify Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          grep -Fq 'memory.recall()' "$MAIN"
          grep -Fq 'var recall = remember' "$MAIN"
          grep -Fq '"Recall: ${recall.value}"' "$MAIN"

          echo "Recall Layer verification passed."

      - name: Verify no test directories
        shell: bash
        run: |
          set -euo pipefail

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No Recall changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
          fi
