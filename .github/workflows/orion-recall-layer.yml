name: ORION Recall Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recall:
    name: Build ORION Recall Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify OrionMemory
        shell: bash
        run: |
          set -euo pipefail

          MEMORY="android/app/src/main/java/com/orion/lite/orion/OrionMemory.kt"

          test -f "$MEMORY"
          grep -Fq 'fun recall()' "$MEMORY"

          echo "OrionMemory.recall() verified."

      - name: Apply Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          test -f "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          echo "MainActivity backup created."

          grep -Fq 'var action = remember {' "$MAIN"
          grep -Fq 'LaunchedEffect(Unit)' "$MAIN"
          grep -Fq 'val device = monitor.read()' "$MAIN"
          grep -Fq '"Action: ${action.value}"' "$MAIN"

          if grep -Fq 'val previous = memory.recall()' "$MAIN"; then
            echo "Recall Layer already exists."
            exit 0
          fi

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # ------------------------------------------------------------
          # 1. Locate complete action remember block
          # ------------------------------------------------------------

          action_marker = "var action = remember {"
          action_start = text.find(action_marker)

          if action_start == -1:
              raise SystemExit("ERROR: action state not found")

          action_open = text.find("{", action_start)

          depth = 0
          action_end = None

          for i in range(action_open, len(text)):
              char = text[i]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      action_end = i + 1
                      break

          if action_end is None:
              raise SystemExit("ERROR: action block is not balanced")

          # ------------------------------------------------------------
          # 2. Add Recall state AFTER complete Action block
          # ------------------------------------------------------------

          recall_state = '''

              var recall = remember {
                  mutableStateOf("No previous event.")
              }'''

          text = (
              text[:action_end]
              + recall_state
              + text[action_end:]
          )

          # ------------------------------------------------------------
          # 3. Add Recall immediately after START of LaunchedEffect
          #    and BEFORE Observe
          # ------------------------------------------------------------

          effect_marker = "LaunchedEffect(Unit) {"
          effect_start = text.find(effect_marker)

          if effect_start == -1:
              raise SystemExit("ERROR: LaunchedEffect(Unit) not found")

          observe_marker = "                val device = monitor.read()"
          observe_pos = text.find(observe_marker, effect_start)

          if observe_pos == -1:
              raise SystemExit("ERROR: Observe marker not found")

          recall_logic = '''                val previous = memory.recall()

                  recall.value = if (previous != null) {
                      "Previous: ${previous.state} | Battery: ${previous.battery}% | Action: ${previous.actionId} | Result: ${previous.result}"
                  } else {
                      "No previous event."
                  }

          '''

          text = (
              text[:observe_pos]
              + recall_logic
              + text[observe_pos:]
          )

          # ------------------------------------------------------------
          # 4. Locate the actual multiline Action Text block
          # ------------------------------------------------------------

          action_ui_marker = '''                    Text(
                        text =
                            "Action: ${action.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )'''

          action_ui_pos = text.find(action_ui_marker)

          if action_ui_pos == -1:
              raise SystemExit(
                  "ERROR: Actual multiline Action Text block not found"
              )

          action_ui_end = action_ui_pos + len(action_ui_marker)

          # ------------------------------------------------------------
          # 5. Add Recall UI AFTER complete Action Text block
          # ------------------------------------------------------------

          recall_ui = '''

                    Text(
                        text =
                            "Recall: ${recall.value}",
                        modifier =
                            Modifier.padding(top = 8.dp)
                    )'''

          text = (
              text[:action_ui_end]
              + recall_ui
              + text[action_ui_end:]
          )

          # ------------------------------------------------------------
          # 6. Write result
          # ------------------------------------------------------------

          path.write_text(text)

          print("Recall Layer source transformation completed.")
          PY

          echo "Checking generated Kotlin structure..."

          grep -Fq 'var recall = remember {' "$MAIN"
          grep -Fq 'val previous = memory.recall()' "$MAIN"
          grep -Fq '"Recall: ${recall.value}"' "$MAIN"

          test "$(grep -Fc 'var recall = remember {' "$MAIN")" -eq 1
          test "$(grep -Fc 'val previous = memory.recall()' "$MAIN")" -eq 1
          test "$(grep -Fc '"Recall: ${recall.value}"' "$MAIN")" -eq 1

          echo "Recall Layer source verification passed."

      - name: Verify Recall placement
        shell: bash
        run: |
          set -euo pipefail

          MAIN="android/app/src/main/java/com/orion/lite/MainActivity.kt"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()

          action = text.find("var action = remember {")
          recall_state = text.find("var recall = remember {")
          effect = text.find("LaunchedEffect(Unit) {")
          recall_logic = text.find("val previous = memory.recall()")
          observe = text.find("val device = monitor.read()")
          recall_ui = text.find('"Recall: ${recall.value}"')

          checks = {
              "Action exists": action >= 0,
              "Recall state exists": recall_state >= 0,
              "Recall state after Action": (
                  recall_state > action
              ),
              "LaunchedEffect exists": effect >= 0,
              "Recall logic exists": recall_logic >= 0,
              "Recall before Observe": (
                  recall_logic >= 0
                  and observe >= 0
                  and recall_logic < observe
              ),
              "Recall UI exists": recall_ui >= 0,
          }

          for name, result in checks.items():
              print(
                  f"{name}: "
                  f"{'OK' if result else 'FAIL'}"
              )

          if not all(checks.values()):
              raise SystemExit(
                  "ERROR: Recall placement verification failed"
              )

          print("Recall placement verification passed.")
          PY

      - name: Verify no test directories
        shell: bash
        run: |
          set -euo pipefail

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

          echo "No test directories found."

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-recall
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit Recall Layer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/src/main/java/com/orion/lite/MainActivity.kt

          if git diff --cached --quiet; then
            echo "No Recall changes to commit."
          else
            git commit -m "feat: add ORION recall layer"
            git push
          fi
