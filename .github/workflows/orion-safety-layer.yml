name: ORION Safety Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ORION with Safety Layer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Create SafetyPolicy
        shell: bash
        run: |
          set -eux

          mkdir -p android/app/src/main/java/com/orion/lite/orion

          cat > android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt <<'EOF'
          package com.orion.lite.orion

          data class SafetyResult(
              val allowed: Boolean,
              val reason: String
          )

          class SafetyPolicy {

              fun check(action: OrionAction): SafetyResult {

                  return when (action.id) {

                      "BATTERY_ATTENTION" -> SafetyResult(
                          allowed = true,
                          reason = "Battery attention action is allowed."
                      )

                      "LOW_POWER_NOTICE" -> SafetyResult(
                          allowed = true,
                          reason = "Low power action is allowed."
                      )

                      "MONITOR" -> SafetyResult(
                          allowed = true,
                          reason = "Normal monitoring is allowed."
                      )

                      else -> SafetyResult(
                          allowed = false,
                          reason = "Action is not authorized."
                      )
                  }
              }
          }
          EOF

      - name: Update MainActivity
        shell: bash
        run: |
          set -eux

          cat > android/app/src/main/java/com/orion/lite/MainActivity.kt <<'EOF'
          package com.orion.lite

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.orion.lite.orion.ActionExecutor
          import com.orion.lite.orion.ActionRouter
          import com.orion.lite.orion.DeviceMonitor
          import com.orion.lite.orion.OrionCore
          import com.orion.lite.orion.OrionKernel
          import com.orion.lite.orion.SafetyPolicy

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val kernel = OrionKernel()
                  val monitor = DeviceMonitor(this)
                  val core = OrionCore()
                  val router = ActionRouter()
                  val safety = SafetyPolicy()
                  val executor = ActionExecutor(this)

                  kernel.register("device_monitor", monitor)
                  kernel.register("core", core)
                  kernel.register("action_router", router)
                  kernel.register("safety_policy", safety)
                  kernel.register("action_executor", executor)

                  kernel.boot()

                  setContent {

                      var state = remember {
                          mutableStateOf("BOOTING")
                      }

                      var battery = remember {
                          mutableStateOf(-1)
                      }

                      var safetyState = remember {
                          mutableStateOf("CHECKING")
                      }

                      var action = remember {
                          mutableStateOf("Starting...")
                      }

                      LaunchedEffect(Unit) {

                          kernel.heartbeat()

                          val device = monitor.read()
                          val decision = core.analyze(device)
                          val routedAction = router.route(decision)

                          val safetyResult =
                              safety.check(routedAction)

                          if (safetyResult.allowed) {

                              val result =
                                  executor.execute(routedAction)

                              action.value = result.message
                              safetyState.value = "ALLOWED"

                          } else {

                              action.value =
                                  "Action blocked by safety policy."

                              safetyState.value = "BLOCKED"
                          }

                          battery.value =
                              device.batteryPercent

                          state.value =
                              decision.state
                      }

                      MaterialTheme {

                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(24.dp),
                              verticalArrangement =
                                  Arrangement.Center
                          ) {

                              Text(
                                  text = "ORION Lite",
                                  style =
                                      MaterialTheme.typography
                                          .headlineMedium
                              )

                              Text(
                                  text =
                                      "Kernel: ${
                                          if (kernel.running)
                                              "ONLINE"
                                          else
                                              "OFFLINE"
                                      }",
                                  modifier =
                                      Modifier.padding(top = 16.dp)
                              )

                              Text(
                                  text =
                                      "State: ${state.value}",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )

                              Text(
                                  text =
                                      "Battery: ${battery.value}%",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )

                              Text(
                                  text =
                                      "Safety: ${safetyState.value}",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )

                              Text(
                                  text =
                                      "Action: ${action.value}",
                                  modifier =
                                      Modifier.padding(top = 8.dp)
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify no test foundation
        shell: bash
        run: |
          set -eux

          test -f android/app/src/main/java/com/orion/lite/orion/SafetyPolicy.kt
          test -f android/app/src/main/java/com/orion/lite/MainActivity.kt

          test ! -d android/app/src/test
          test ! -d android/app/src/androidTest

      - name: Build APK
        working-directory: android
        run: |
          set -eux

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit foundation
        shell: bash
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes."
          else
            git commit -m "feat: add ORION safety policy"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ORION-Lite-safety-layer
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
