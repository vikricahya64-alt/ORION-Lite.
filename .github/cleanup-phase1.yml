name: ORION Cleanup Phase 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository before cleanup
        run: |
          echo "=== BEFORE CLEANUP ==="
          echo
          echo "--- Root ---"
          find . -maxdepth 2 -print | sort

          echo
          echo "--- Suspicious files ---"
          find . -type f \
            \( \
              -name "*.zip" \
              -o -iname "*backup*" \
              -o -iname "*snapshot*" \
              -o -iname "*old*" \
              -o -name "*.before_*" \
              -o -name "*.bak" \
              -o -name "*.log" \
            \) \
            -print | sort

      - name: Validate Android source
        run: |
          set -e

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts

          echo "Android source exists."

      - name: Safe cleanup
        run: |
          set -e

          echo "Removing generated files..."

          find . \
            -type d \
            \( \
              -name "__pycache__" \
              -o -name ".pytest_cache" \
              -o -name ".mypy_cache" \
              -o -name ".ruff_cache" \
            \) \
            -prune \
            -exec rm -rf {} +

          find . \
            -type d \
            \( \
              -name "build" \
              -o -name ".gradle" \
            \) \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.tmp" \
              -o -name "*.bak" \
              -o -name "*.before_*" \
            \) \
            -delete

          find . \
            -type f \
            -name "local.properties" \
            -delete

          echo "Safe cleanup completed."

      - name: Verify Android source after cleanup
        run: |
          set -e

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts

          echo "Android source still intact."

      - name: Check Gradle Wrapper
        run: |
          echo "=== GRADLE WRAPPER ==="

          if [ -f android/gradlew ]; then
            echo "gradlew: OK"
          else
            echo "gradlew: MISSING"
          fi

          if [ -f android/gradlew.bat ]; then
            echo "gradlew.bat: OK"
          else
            echo "gradlew.bat: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar: OK"
          else
            echo "wrapper jar: MISSING"
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "wrapper properties: OK"
          else
            echo "wrapper properties: MISSING"
          fi

      - name: Generate cleanup report
        run: |
          {
            echo "# ORION-Lite Cleanup Phase 1"
            echo
            echo "## Remaining ZIP files"
            find . -type f -name "*.zip" -print | sort || true
            echo
            echo "## Remaining backup-like files"
            find . -type f \
              \( \
                -iname "*backup*" \
                -o -iname "*snapshot*" \
                -o -iname "*old*" \
              \) \
              -print | sort || true
            echo
            echo "## Android structure"
            find android -maxdepth 3 -print | sort
          } > cleanup-phase1-report.md

      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: ORION-cleanup-phase1-report
          path: cleanup-phase1-report.md

      - name: Show changes
        run: |
          echo "=== GIT STATUS ==="
          git status --short
